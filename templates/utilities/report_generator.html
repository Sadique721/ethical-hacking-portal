{% extends 'base.html' %}

{% block title %}Vulnerability Report Generator{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg bg-dark text-white border-secondary">
                <div class="card-header bg-danger text-white text-center">
                    <h3><i class="bi bi-file-earmark-pdf-fill"></i> PENTEST_REPORT_GENERATOR</h3>
                </div>
                <div class="card-body">
                    <p class="text-secondary text-center mb-4">Input finding metrics to compile a professional, executive-ready PDF vulnerability report in the background.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label text-info">Vulnerability Title:</label>
                            <input type="text" id="title" name="title" class="form-control bg-black text-white border-secondary font-monospace" placeholder="e.g. SQL Injection in Auth Endpoint" required>
                        </div>
                        
                        <!-- Severity & CVSS -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="severity" class="form-label text-info">Severity Rating:</label>
                                <select id="severity" name="severity" class="form-select bg-black text-white border-secondary font-monospace">
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                    <option value="Critical">Critical</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="cvss_score" class="form-label text-info">CVSS v3.1 Score (0.0 - 10.0):</label>
                                <input type="number" step="0.1" min="0" max="10" id="cvss_score" name="cvss_score" class="form-control bg-black text-white border-secondary font-monospace" value="5.0" required>
                            </div>
                        </div>
                        
                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label text-info">1. Vulnerability Description / Proof of Concept:</label>
                            <textarea id="description" name="description" rows="4" class="form-control bg-black text-white border-secondary font-monospace" placeholder="Describe the vulnerability detail, how it was discovered, and code blocks showing proof of concept..." required></textarea>
                        </div>
                        
                        <!-- Impact -->
                        <div class="mb-3">
                            <label for="impact" class="form-label text-info">2. Technical & Business Impact:</label>
                            <textarea id="impact" name="impact" rows="3" class="form-control bg-black text-white border-secondary font-monospace" placeholder="What are the consequences of exploitation? (e.g., unauthorized data disclosure, remote command execution...)" required></textarea>
                        </div>
                        
                        <!-- Remediation -->
                        <div class="mb-3">
                            <label for="remediation" class="form-label text-info">3. Remediation & Fix Strategy:</label>
                            <textarea id="remediation" name="remediation" rows="3" class="form-control bg-black text-white border-secondary font-monospace" placeholder="Provide step-by-step instructions on how the development team should address this vulnerability..." required></textarea>
                        </div>
                        
                        <!-- Submit -->
                        <button type="submit" class="btn btn-danger w-100 font-monospace mt-3">
                            <i class="bi bi-file-earmark-arrow-down-fill"></i> COMPILE_PDF_REPORT
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
