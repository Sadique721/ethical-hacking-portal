<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <!-- Decorative circuit lines -->
  <line x1="0" y1="280" x2="80" y2="280" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="280" x2="80" y2="260" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="280" x2="300" y2="280" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="280" x2="220" y2="260" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <!-- Avatar circle -->
  <circle cx="150" cy="120" r="70" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- SA initials -->
  <text x="150" y="140" font-family="'Outfit',Arial,sans-serif" font-size="52" font-weight="bold" fill="#38bdf8" text-anchor="middle">SA</text>
  <!-- Verified badge -->
  <circle cx="205" cy="75" r="16" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="205" y="80" font-family="Arial" font-size="14" fill="#38bdf8" text-anchor="middle">✓</text>
  <!-- Name -->
  <text x="150" y="220" font-family="'Outfit',Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Sadique Amin</text>
  <text x="150" y="242" font-family="monospace" font-size="13" fill="#38bdf8" text-anchor="middle">Chief Technology Officer</text>
  <!-- Tag -->
  <rect x="95" y="255" width="110" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="150" y="271" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">@sadique721</text>
</svg>
